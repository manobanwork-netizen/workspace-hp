<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workspace">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4f43a3">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Workspace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#ffffff;--tx:#0b1220;--mu:rgba(60,68,92,.72);--ac:#0a84ff;--ok:#30b266;--warn:#ff9f0a;--err:#ff453a;
--g:rgba(255,255,255,.78);--g2:rgba(244,247,253,.9);--hl:rgba(255,255,255,1);--hl2:rgba(70,90,140,.10);--sh:rgba(40,60,110,.16);--bd:rgba(70,90,140,.12);--sf:rgba(255,255,255,.8);--sf2:rgba(110,125,165,.14);
--gs:rgba(255,255,255,.9);--b1:rgba(10,132,255,.10);--b2:rgba(191,90,242,.07);--b3:rgba(100,210,255,.11);--b4:rgba(255,159,10,.06);
--r1:32px;--r2:24px;--rp:999px;color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;letter-spacing:-.022em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
html{background:var(--bg)}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(104px + env(safe-area-inset-bottom));min-height:100vh}
body::before{content:"";position:fixed;inset:-12% -12%;z-index:-1;background:radial-gradient(42% 30% at 14% 8%,var(--b1),transparent 72%),radial-gradient(38% 30% at 92% 24%,var(--b2),transparent 72%),radial-gradient(46% 34% at 18% 68%,var(--b3),transparent 72%),radial-gradient(40% 30% at 88% 92%,var(--b4),transparent 72%),var(--bg)}
button{font:inherit;letter-spacing:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .18s ease,background-color .18s ease}
button:active{transform:scale(.97)}
h1{font-size:34px;line-height:1.1;margin:8px 0 2px;letter-spacing:-.03em;font-weight:700}
h2{font-size:15px;font-weight:600;color:var(--mu);margin:26px 8px 9px;letter-spacing:-.01em}
.wrap{padding:12px 16px 20px;max-width:640px;margin:0 auto}
.sub{color:var(--mu);font-size:15px;margin:0 0 8px}
/* bahan kaca: semua permukaan memakai resep yang sama */
.card,.kpi,.tile,.chip,.ib,.ban,.lnk.alt,select,input[type=search],input[type=text],.tabs,.sheet{background-color:var(--g);background-image:linear-gradient(165deg,rgba(255,255,255,.30),rgba(255,255,255,0) 46%);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:0;box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--hl2),0 12px 32px -10px var(--sh)}
@supports not (backdrop-filter:blur(1px)){.card,.kpi,.tile,.chip,.ib,.ban,.lnk.alt,select,input[type=search],input[type=text],.tabs,.sheet{background-color:var(--gs)}}
.card{border-radius:var(--r2);padding:15px 16px;margin:0 0 11px}
.card.tap{display:block;width:100%;text-align:left}.card.tap:active{background-color:var(--g2)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.t{font-weight:600;font-size:17px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.s{color:var(--mu);font-size:14px;margin-top:3px;letter-spacing:-.01em}
.pill,.badge{display:inline-block;padding:3px 11px;border-radius:var(--rp);font-size:13px;font-weight:600;white-space:nowrap;letter-spacing:-.01em;box-shadow:inset 0 1px 0 var(--hl2)}
.pill{--c:var(--ac);background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--tx))}
.b-err{background:color-mix(in srgb,var(--err) 20%,transparent);color:var(--err)}.b-warn{background:color-mix(in srgb,var(--warn) 26%,transparent);color:#a35f00}

.b-mu{background:var(--sf2);color:var(--mu)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:6px}
.kpi{position:relative;border-radius:var(--r2);padding:15px 16px 14px}
.kpi::before{content:"";position:absolute;right:16px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--ac));box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--ac)) 22%,transparent)}
.kpi b{display:block;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em}.kpi span{color:var(--mu);font-size:14px}
.bar{display:flex;height:10px;border-radius:var(--rp);overflow:hidden;background:var(--sf2)}.bar i{display:block;height:100%}
.hz{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.hz::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:var(--rp);font-size:15px;white-space:nowrap;font-weight:500}
.chip.on{background-color:color-mix(in srgb,var(--ac) 82%,transparent);color:#fff;font-weight:600}
input[type=search],input[type=text],select{width:100%;font:inherit;letter-spacing:inherit;padding:12px 16px;border-radius:var(--rp);color:var(--tx);appearance:none;-webkit-appearance:none}
input::placeholder{color:var(--mu)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px;font-size:15px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),440px);display:flex;gap:2px;padding:6px;border-radius:var(--rp);z-index:20}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;letter-spacing:0;color:var(--mu);padding:7px 0 6px;border-radius:var(--rp);min-height:54px}
.tabs button.on{color:var(--ac);background-color:var(--g2);box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--hl2)}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mi{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{border-radius:var(--r2);padding:15px;text-align:left;min-height:104px}.tile:active{background-color:var(--g2)}
.tile .e{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc,var(--ac)) 20%,transparent);color:var(--tc,var(--ac));box-shadow:inset 0 1px 0 var(--hl2)}.tile .e .mi{width:23px;height:23px}
.tile b{display:block;font-size:16px;margin-top:10px;font-weight:600}.tile span{color:var(--mu);font-size:14px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ib{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin-top:6px;flex:none}
.ban{border-radius:var(--r2);padding:11px 15px;font-size:14px;margin:6px 0 12px;background-color:color-mix(in srgb,var(--warn) 20%,var(--g))}
.ban .mi{color:var(--warn);margin-right:4px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,34,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;display:none}.sheet-bg.on{display:block}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;background-color:var(--gs);border-radius:38px;padding:8px 18px 26px;z-index:41;transform:translateY(120%);transition:transform .32s cubic-bezier(.2,.9,.25,1);max-width:624px;margin:0 auto}.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:var(--rp);background:var(--sf2);margin:4px auto 14px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:8px 12px;font-size:15px;margin:14px 0}.kv dt{color:var(--mu)}.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.lnk{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border-radius:var(--rp);background:color-mix(in srgb,var(--ac) 88%,transparent);color:#fff;text-decoration:none;font-weight:600;margin:10px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 24px -8px color-mix(in srgb,var(--ac) 60%,transparent)}
.lnk.alt{color:var(--ac)}
.mr{display:grid;grid-template-columns:minmax(80px,40%) 1fr 30px;gap:10px;align-items:center;margin:9px 0;font-size:15px}.mr .bar{height:12px}.mr b{text-align:right}
.cols{display:flex;align-items:flex-end;gap:6px;height:112px;margin-top:6px}.cols>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mu);height:100%}.cols i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 70%,#fff),var(--ac));min-height:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.empty{text-align:center;color:var(--mu);padding:36px 12px}
.pre{white-space:pre-line;font-size:16px;line-height:1.55}
.login{max-width:380px;margin:11vh auto 0;text-align:center}.login .logo{width:84px;height:84px;border-radius:24px;margin:0 auto 16px;display:block;box-shadow:0 14px 34px -10px var(--sh),inset 0 1px 0 var(--hl)}
.login input{text-align:center;margin:14px 0 10px;font-size:15px}.login .go{width:100%;padding:14px;border-radius:var(--rp);background:color-mix(in srgb,var(--ac) 88%,transparent);color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 24px -8px color-mix(in srgb,var(--ac) 60%,transparent)}.err{color:var(--err);min-height:22px;font-size:14px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--mu);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}@keyframes sp{to{transform:rotate(360deg)}}
/* laporan (Content Report & Release Report) */
.rep{padding:18px 16px 14px}
.rh{font-size:20px;font-weight:700;letter-spacing:-.025em}
.rsel{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;margin:12px 0 14px}.rsel select{padding:10px 34px 10px 16px;font-size:16px;background-color:var(--g2)}
.rin{background-color:var(--g2);background-image:linear-gradient(165deg,rgba(255,255,255,.22),rgba(255,255,255,0) 50%);box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--hl2)}
.rtiles{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.rt{grid-column:span 2;border-radius:22px;padding:12px 10px 11px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:0}.rt.t2{grid-column:span 3}
.rt:active,.rtot:active{background-color:var(--g)}
.ti{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 16px -6px color-mix(in srgb,var(--c) 70%,transparent)}.ti svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rt b{font-size:32px;line-height:1.05;font-weight:700;letter-spacing:-.03em;margin-top:9px}.rl{font-size:13px;color:var(--mu);line-height:1.25;letter-spacing:-.01em}
.rtot{display:block;width:100%;text-align:left;border-radius:22px;padding:15px 16px;margin:10px 0 4px}.rtot b{display:block;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.035em;margin:2px 0 3px}
.rbars{margin:10px 2px 2px}.rb{display:grid;grid-template-columns:104px 1fr 28px;gap:8px;align-items:center;margin:11px 0;font-size:14px;width:100%;text-align:left}.rb .rl{font-size:13px}.rb .bar{height:10px}.rb b{text-align:right;font-weight:600}
.rb .bar i{border-radius:var(--rp)}

.rf{font-size:13px;color:var(--mu);margin:12px 2px 0;line-height:1.35}
.rcols{display:flex;align-items:flex-end;gap:4px;height:156px;margin:16px 0 2px}.rcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;font-size:12px;color:var(--mu);height:100%;min-width:0}
.rcol i{display:block;width:100%;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#5b97ff,#3b7cf6);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}.rcol.now i{background:linear-gradient(180deg,#ffd060,#f5b301)}.rcol.now{color:var(--tx);font-weight:600}
.rcol span:first-child{color:var(--tx);font-weight:600;min-height:15px}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card.tap.rrow,.rrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;text-decoration:none;color:inherit;padding:13px 15px}
.rrow .t{font-size:16px;-webkit-line-clamp:3}
.hrep{display:grid;grid-template-columns:1fr 1fr;gap:11px}.hrep .rt{grid-column:auto;border-radius:var(--r2);padding:14px 15px}
.rsub{font-size:14px;color:var(--mu);margin:0 0 12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}

/* ===== TEMA CAREPATH (sama dengan index.html): indigo, putih, kuning, koral ===== */
:root{--font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--bg:#e8eaf7;--tx:#1d1f4f;--mu:#8489b3;--ac:#2f3192;--ok:#4a6fd0;--warn:#f4bf2a;--err:#e5666b;--g:#fff;--g2:#f3f4fc;--gs:#fff;--hl:transparent;--hl2:transparent;--sh:rgba(52,56,140,.10);--bd:#eceefa;--sf:#fff;--sf2:#eceefc;--b1:transparent;--b2:transparent;--b3:transparent;--b4:transparent}
html,body,button,select,input{font-family:var(--font)}
html{background:var(--bg)}
body::before{background:var(--bg)}
.card,.kpi,.tile,.chip,.ib,.ban,.lnk.alt,select,input[type=search],input[type=text],.tabs,.sheet{background-color:#fff;background-image:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 10px 30px rgba(52,56,140,.07)}
.card.tap:active,.tile:active,.rt:active,.rtot:active{background-color:#f3f4fc}
.chip.on{background-color:var(--ac);color:#fff}
.tabs button.on{color:var(--ac);background-color:#eceefc;box-shadow:none}
.ban{background-color:#fff6d9}
.lnk{background:var(--ac);box-shadow:0 8px 18px rgba(47,49,146,.25)}
.login .go{background:var(--ac);box-shadow:0 8px 18px rgba(47,49,146,.25)}
.rin{background-color:#f3f4fc;background-image:none;box-shadow:none}
.rsel select{background-color:#f3f4fc;box-shadow:none}
.rcol i{background:linear-gradient(180deg,#7f86f0,#2f3192)}.rcol.now i{background:linear-gradient(180deg,#f8d160,#f4bf2a)}
.cols i{background:linear-gradient(180deg,#7f86f0,#2f3192)}
.sheet-bg{background:rgba(29,31,79,.32)}
.b-warn{background:color-mix(in srgb,var(--warn) 26%,transparent);color:#8a6100}
/* ===== Beranda ringkas ===== */
.hc{margin:0 0 6px}.hc h1{font-size:24px;margin:2px 0 0}.hc .sub{font-size:13px;margin:0}.hc .ib{width:38px;height:38px;margin-top:0;font-size:17px}
.kpis.k4{grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:0}
.k4 .kpi{padding:10px 10px 9px;border-radius:18px}.k4 .kpi::before{width:7px;height:7px;right:9px;top:9px;box-shadow:none}
.k4 .kpi b{font-size:24px}.k4 .kpi span{font-size:11.5px;line-height:1.2;display:block;margin-top:1px}
.home h2{font-size:13px;margin:14px 6px 6px}
.hrep{gap:8px}.hrep .rt{flex-direction:row;align-items:center;gap:10px;padding:9px 12px;border-radius:18px}
.hrep .ti{width:30px;height:30px;border-radius:10px;flex:none}.hrep .ti svg{width:17px;height:17px}
.hrep .rt b{font-size:22px;margin:0}.hrep .rl{font-size:11.5px;line-height:1.2}
.mr2{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 4px;border-top:1px solid var(--bd)}.mr2:first-child{border-top:0}
.mr2 .mt{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr2 .badge{font-size:11.5px;padding:2px 9px}.mr2 .ml{font-size:11.5px;color:var(--mu);flex:none}
.card.cp{padding:8px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--mu);padding-bottom:3px}
.cal button{position:relative;height:34px;border-radius:11px;font-size:13px;font-weight:500;color:var(--tx)}
.cal button.td{box-shadow:inset 0 0 0 1.5px var(--warn);font-weight:700}
.cal button.sel{background:var(--ac);color:#fff;font-weight:700}
.cal button u{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--warn)}
.cal button u.od{background:var(--err)}.cal button.sel u{background:#fff}
.cal i{display:block}
.calh{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}.calh b{font-size:14px}
.calh span button{width:30px;height:30px;font-size:20px;line-height:1;border-radius:50%;color:var(--ac)}
.calh .tdy{font-size:12px;font-weight:600;color:var(--ac);padding:0 8px;width:auto}
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sg2 button{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 12px;border-radius:16px;font-size:13px;text-align:left}
.sg2 button span:first-child{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg2 b{font-size:13px;flex:none}

/* ===== TEMA INDIGO v2 (referensi: UI Covid-19, header indigo, kartu warna solid, sheet putih, toggle pill) ===== */
:root{--bg:#eff0fb;--tx:#221c5a;--mu:#7f7aa9;--ac:#4a3f98;--ok:#4fc072;--warn:#f4a64a;--err:#ee6a5b;--g:#fff;--g2:#f4f3fd;--gs:#fff;--sf:#fff;--sf2:#ebe9fa;--bd:#ecebf8;--sh:rgba(74,63,152,.20);--r1:34px;--r2:26px;--ind1:#5a4db5;--ind2:#3b3185}
html,body{background:var(--bg)}
body::before{background:radial-gradient(70% 26% at 100% 4%,rgba(138,99,230,.12),transparent 70%),radial-gradient(60% 24% at 0% 46%,rgba(85,168,245,.10),transparent 70%),radial-gradient(60% 24% at 100% 90%,rgba(244,166,74,.09),transparent 70%),var(--bg)}
body::after{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#4f43a3;z-index:60;pointer-events:none}
.wrap h2{color:#2b2566;font-weight:700;font-size:16px;letter-spacing:-.015em;margin:24px 6px 10px}
.wrap>.hd:first-child{position:relative;overflow:hidden;margin:-12px -16px 18px;padding:22px 22px 28px;border-radius:0 0 36px 36px;color:#fff;background:radial-gradient(190px 160px at 102% -6%,rgba(255,255,255,.16),transparent 70%),radial-gradient(170px 170px at -4% 125%,rgba(138,99,230,.55),transparent 70%),linear-gradient(160deg,#5246a8,#3b3185);box-shadow:0 22px 40px -18px rgba(59,49,133,.65);align-items:center}
.wrap>.hd:first-child h1{color:#fff;font-size:28px;margin:0;letter-spacing:-.03em}
.wrap>.hd:first-child .sub{color:rgba(255,255,255,.74);margin:4px 0 0;font-size:14px}
.wrap>.hd:first-child .ib{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:none;margin-top:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.wrap>.hd:first-child .spin{border-color:#fff;border-right-color:transparent}
.card,.tile,.ban,select,input[type=search],input[type=text],.sheet,.tabs{background:#fff;border:0;box-shadow:0 14px 34px -16px var(--sh)}
.card{border-radius:var(--r2)}
select,input[type=search],input[type=text]{border-radius:999px;box-shadow:0 8px 22px -14px var(--sh);color:var(--tx)}
.rsel select{background-color:var(--g2);box-shadow:none}
.chip{background:#fff;box-shadow:0 8px 18px -12px var(--sh);font-weight:600;color:var(--ac)}
.hz{background:#e7e5f8;border-radius:999px;padding:5px;gap:2px;margin:2px 0 14px}

const evMap=()=>{const m={},add=(d,k,r)=>{if(d)(m[d]=m[d]||[]).push([k,r])},ad=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toLocaleDateString("sv")};
  const R=S();(R.task||[]).forEach(r=>add(r.deadline,"task",r));(R.dispo||[]).forEach(r=>add(r.dl,"dispo",r));(R.rapat||[]).forEach(r=>add(r.tgl,"rapat",r));(R.rilis||[]).forEach(r=>add(r.tgl,"rilis",r));(R.konten||[]).forEach(r=>add(r.tgl,"konten",r));
  (R.pameran||[]).forEach(p=>{if(p.tgl1){let d=p.tgl1,n=0;while(d<=(p.tgl2||p.tgl1)&&n++<31){add(d,"pameran",p);d=ad(d,1)}}});return m};
function cmv(n){const [y,m]=A.cm.split("-").map(Number),x=new Date(y,m-1+n,1);A.cm=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");A.cd=A.cm+"-01";window._keep=1;render()}
function cday(d){A.cd=d;window._keep=1;render()}
function ctoday(){A.cm=TD.slice(0,7);A.cd=TD;window._keep=1;render()}
function homeCal(){
  const E=evMap(),[y,mo]=A.cm.split("-").map(Number),off=(new Date(y,mo-1,1).getDay()+6)%7,dn=new Date(y,mo,0).getDate();
  let c=["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(d=>`<em>${d}</em>`).join("")+"<i></i>".repeat(off);
  for(let d=1;d<=dn;d++){const k=A.cm+"-"+String(d).padStart(2,"0"),e=E[k]||[],od=e.some(([kk,o])=>!isDone(kk,o)&&!MENUS[kk].nost&&k<TD);
    c+=`<button class="${k===TD?"td":""} ${k===A.cd?"sel":""}" onclick="cday('${k}')">${d}${e.length?`<u class="${od?"od":""}"></u>`:""}</button>`}
  const ag=E[A.cd]||[];
  return `<div class="card cp"><div class="calh"><b>${MXB[mo-1]} ${y}</b><span><button onclick="cmv(-1)" aria-label="Bulan sebelumnya">‹</button><button class="tdy" onclick="ctoday()">Hari ini</button><button onclick="cmv(1)" aria-label="Bulan berikutnya">›</button></span></div><div class="cal">${c}</div>
  <div style="border-top:1px solid var(--bd);margin-top:6px;padding-top:4px"><div class="s" style="margin:2px 4px 0;font-size:12px">${fd(A.cd)}${ag.length?" · "+ag.length+" agenda":""}</div>${ag.length?ag.slice(0,3).map(([k,r])=>`<button class="mr2" onclick="openItem('${k}','${esc(r.id)}')"><i class="dot" style="background:${TC[k]}"></i><span class="mt">${esc(MENUS[k].ti(r))}</span><span class="ml">${esc(MENUS[k].t)}</span></button>`).join("")+(ag.length>3?`<div class="s" style="text-align:center;font-size:12px;margin:2px 0 0">+${ag.length-3} lainnya</div>`:""):`<div class="s" style="margin:6px 4px 4px;font-size:12.5px">Tidak ada agenda.</div>`}</div></div>`}
function pHome(){
  const D=A.data,all=[];let late=0,soon=0;
  ORDER.forEach(k=>{if(MENUS[k].nost)return;(S()[k]||[]).forEach(r=>{const d=due(k,r);if(!d)return;if(d.n<0)late++;else if(d.n<=7)soon++;if(d.n<=3)all.push([k,r,d])})});
  all.sort((a,b)=>a[2].n-b[2].n);
  const name=(D.CFG&&(D.CFG.user||D.CFG.name))||"";
  let h=`<div class="wrap home"><div class="hd hc"><div><h1>Beranda</h1><p class="sub">Halo${name?", "+esc(name):""} · ${fd(TD)}</p></div>${refBtn()}</div>${banner()}`;
  h+=`<div class="kpis k4"><div class="kpi" style="--c:#8a63e6" onclick="go('list','dispo')"><b>${active("dispo").length}</b><span>Dispo aktif</span></div><div class="kpi" style="--c:#55a8f5" onclick="go('list','task')"><b>${active("task").length}</b><span>Task aktif</span></div><div class="kpi" style="--c:#ee6a5b"><b>${late}</b><span>Terlambat</span></div><div class="kpi" style="--c:#f4a64a"><b>${soon}</b><span>≤ 7 hari</span></div></div>`;
  h+=`<h2>Kalender</h2>`+homeCal();
  h+=`<h2>Perlu perhatian</h2>`+(all.length?`<div class="card cp">${all.slice(0,4).map(([k,r,d])=>`<button class="mr2" onclick="openItem('${k}','${esc(r.id)}')"><i class="dot" style="background:${TC[k]}"></i><span class="mt">${esc(MENUS[k].ti(r))}</span><span class="badge ${d.c}">${d.t}</span></button>`).join("")}${all.length>4?`<div class="s" style="text-align:center;font-size:12px;margin:2px 0 0">+${all.length-4} lainnya</div>`:""}</div>`:`<div class="card cp s" style="margin:0;font-size:13px">Tidak ada yang terlambat atau jatuh tempo dalam 3 hari.</div>`);
  h+=homeRep();
  h+=`<h2>Ringkasan</h2><div class="sg2">`;
  ORDER.forEach(k=>{const m=MENUS[k];if(m.nost)return;const rs=S()[k]||[];h+=`<button class="card" style="margin:0" onclick="go('list','${k}')"><span>${m.e} ${esc(m.t)}</span><b>${rs.filter(r=>!isDone(k,r)).length}<span class="s" style="margin:0;font-weight:400">/${rs.length}</span></b></button>`});
  return h+`</div></div>`;
}

function pList(){
  const k=A.menu,m=MENUS[k],rs=(S()[k]||[]).slice(),q=A.q.trim().toLowerCase();
  let list=rs.filter(r=>{if(q&&!(JSON.stringify(r)).toLowerCase().includes(q))return false;
    if(m.nost||A.flt==="semua")return true;if(A.flt==="aktif")return !isDone(k,r);return r.status===A.flt});
  const key=r=>m.key(r)||"",act=A.flt==="aktif";
  list.sort((a,b)=>{const x=key(a),y=key(b);if(!x&&!y)return 0;if(!x)return 1;if(!y)return -1;return act?(x<y?-1:x>y?1:0):(x<y?1:x>y?-1:0)});
  const chips=m.nost?"":`<div class="hz">${[["aktif","Aktif"],["semua","Semua"]].concat(ST(k).map(s=>[s.n,s.n])).map(([v,l])=>`<button class="chip ${A.flt===v?"on":""}" onclick="A.flt='${esc(v)}';render()">${esc(l)}</button>`).join("")}</div>`;
  return `<div class="wrap">${head(m.t,rs.length+" item",refBtn())}${banner()}${!q&&k==="konten"?kReport():!q&&k==="rilis"?rReport():""}<input type="search" placeholder="Cari…" value="${esc(A.q)}" oninput="A.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const i=$('input[type=search]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)" style="margin:6px 0 10px">${chips}${list.length?list.slice(0,80).map(r=>itemCard(k,r)).join("")+(list.length>80?`<p class="sub" style="text-align:center">Menampilkan 80 dari ${list.length}. Persempit dengan pencarian.</p>`:""):`<div class="empty">${!q&&A.flt==="aktif"&&!m.nost?"Tidak ada "+esc(m.t)+" yang aktif.<br>Ketuk <b>Semua</b> untuk melihat riwayat.":"Tidak ada data."}</div>`}</div>`;
}

/* ---------- media monitoring ---------- */
function mxRows(){
  if(!A.sheet)return null;const loc=(A.data&&A.data.MM&&A.data.MM.local)||[],ks=new Set(A.sheet.map(mxKey));
  return A.sheet.concat(loc.filter(r=>r&&r.Title&&r.Date&&!ks.has(mxKey(r))));
}
const mxLabel=f=>{const p=[];if(f.b)p.push(MXB[f.b-1]);else if(f.q)p.push("Triwulan "+MXR[f.q-1]);if(f.y)p.push(f.y);return p.length?p.join(" "):"Semua Periode"};
function pMedia(){
  if(A.sheet===null)loadSheet();
  let h=`<div class="wrap">${head("Media Monitoring","Pemberitaan sektor Industri Agro",`${refBtn()}`)}${banner()}`;
  const all=mxRows();
  if(all===null)return h+`<div class="empty"><span class="spin"></span></div></div>`;
  if(A.sheetErr)h+=`<div class="ban">${mi(IC.warn)} ${esc(A.sheetErr)}</div>`;
  if(!all.length)return h+`<div class="empty card">Belum ada data media monitoring.</div></div>`;
  const f=A.mx,u=(rs,k)=>[...new Set(rs.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a-b);
  if(f.y===""&&!f._init){f.y=String(Math.max(...u(all,"_y")));f._init=1}
  const a1=all.filter(r=>!f.y||r._y==f.y),a2=a1.filter(r=>!f.q||r._q==f.q);
  const rs=mxF(all,{y:f.y,q:f.q,b:f.b,w:""}),T=mxT3(rs),tot=rs.length,lab=mxLabel(f);
  const sel=(id,opts,val,fn)=>`<select id="${id}" onchange="${fn}">${opts.map(([v,l])=>`<option value="${v}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0 12px">${sel("fy",[["","Semua tahun"]].concat(u(all,"_y").reverse().map(v=>[v,v])),f.y,"A.mx.y=this.value;A.mx.q='';A.mx.b='';A.mx.n=15;render()")}${sel("fq",[["","Triwulan"]].concat(u(a1,"_q").map(v=>[v,"TW "+MXR[v-1]])),f.q,"A.mx.q=this.value;A.mx.b='';A.mx.n=15;render()")}${sel("fb",[["","Bulan"]].concat(u(a2,"_m").map(v=>[v,MXB[v-1]])),f.b,"A.mx.b=this.value;A.mx.n=15;render()")}</div>`;
  const pc=n=>tot?Math.round(n/tot*1000)/10:0,fp=n=>String(n).replace(".",",")+"%";
  h+=`<div class="kpis"><div class="kpi" style="--c:var(--ac)"><b>${tot}</b><span>Total pemberitaan · ${esc(lab)}</span></div><div class="kpi" style="--c:${MXC.Positive}"><b>${fp(pc(T.Positive))}</b><span>Positif (${T.Positive})</span></div><div class="kpi" style="--c:${MXC.Neutral}"><b>${fp(pc(T.Neutral))}</b><span>Netral (${T.Neutral})</span></div><div class="kpi" style="--c:${MXC.Negative}"><b>${fp(pc(T.Negative))}</b><span>Negatif (${T.Negative})</span></div></div>`;
  if(!tot)return h+`<div class="empty card">Tidak ada data untuk periode ini.</div></div>`;
  h+=`<div class="bar" style="margin:4px 0 4px">${MXT.map(t=>T[t]?`<i style="width:${T[t]/tot*100}%;background:${MXC[t]}"></i>`:"").join("")}</div>`;
  const nar=((A.data.MM&&A.data.MM.ai)||{})[lab];
  if(nar)h+=`<h2>Ringkasan eksekutif <span class="badge b-mu" style="text-transform:none;letter-spacing:0">narasi AI tersimpan</span></h2><div class="card pre">${esc(nar)}</div>`;
  const grp=f.b?"_w":"_m",gl=f.b?(v=>"M"+MXR[v-1]):(v=>BL[v-1]),gk=u(rs,grp),gc=mxCnt(rs,r=>r[grp]),gm=Math.max(1,...gc.values());
  h+=`<h2>Tren ${f.b?"mingguan":"bulanan"}</h2><div class="card"><div class="cols">${gk.map(v=>`<div><b style="color:var(--tx);font-size:12px">${gc.get(v)||0}</b><i style="height:${(gc.get(v)||0)/gm*78}%"></i>${gl(v)}</div>`).join("")}</div></div>`;
  const top=(title,fn,n)=>{const t=mxTop(mxCnt(rs,fn),n),mx=t.length?t[0][1]:1;return t.length?`<h2>${title}</h2><div class="card">${t.map(([k,v])=>`<div class="mr"><span>${esc(k)}</span><div class="bar"><i style="width:${v/mx*100}%;background:var(--ac)"></i></div><b>${v}</b></div>`).join("")}</div>`:""};
  h+=top("Media terbanyak",r=>r["Media Name"],6)+top("Isu terbanyak",r=>r.Isu,6)+top("Jenis media",r=>r["Media Type"],4);
  const neg=mxTop(mxCnt(rs.filter(r=>r.Tone==="Negative"),r=>r.Isu),4);
  if(neg.length)h+=`<h2>Isu negatif teratas</h2><div class="card">${neg.map(([k,v])=>`<div class="row sp" style="margin:6px 0"><span>${esc(k)}</span><span class="badge b-err">${v} berita</span></div>`).join("")}</div>`;
  const rows=rs.slice().sort((a,b)=>a.Date<b.Date?1:a.Date>b.Date?-1:0);
  h+=`<h2>Berita terbaru</h2>`+rows.slice(0,f.n).map((r,i)=>`<button class="card tap" onclick="openNews(${i})"><div class="row" style="align-items:flex-start"><i class="dot" style="background:${MXC[r.Tone]||MXC.X};margin-top:7px"></i><div class="grow"><div class="t">${esc(r.Title)}</div><div class="s">${esc(r["Media Name"])} · ${fd(r.Date)}${r.Isu?" · "+esc(r.Isu):""}</div></div></div></button>`).join("");
  if(rows.length>f.n)h+=`<button class="chip" style="display:block;margin:6px auto" onclick="A.mx.n+=15;render()">Tampilkan lebih banyak (${rows.length-f.n})</button>`;
  window._news=rows;return h+`</div>`;
}
function openNews(i){
  const r=(window._news||[])[i];if(!r)return;let h=`<div class="grab"></div><div class="s" style="margin:0 0 4px">${mi(IC.rilis)} ${esc(r["Media Name"])}</div><div class="t" style="-webkit-line-clamp:unset;font-size:18px">${esc(r.Title)}</div>`;
  h+=`<div class="row" style="margin-top:10px"><span class="pill" style="background:${MXC[r.Tone]||MXC.X}">${esc(MXTL[r.Tone]||"Tanpa tone")}</span></div>`;
  const kv=[["Tanggal",fd(r.Date)],["Jenis media",r["Media Type"]],["Tier",r["Media Tier"]],["Kategori",r.Category],["Isu",r.Isu],["Narasumber",[r["Spokeperson 1"],r["Spokeperson 2"]].filter(Boolean).join(", ")],["Unit",r["Unit Eselon"]]].filter(x=>x[1]);
  h+=`<dl class="kv">${kv.map(([l,v])=>`<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  if(/^https?:\/\//.test(r.Source||""))h+=`<a class="lnk" href="${esc(r.Source)}" target="_blank" rel="noopener">Buka berita ↗</a>`;
  $("#sheet").innerHTML=h;$("#sheet").scrollTop=0;$("#sbg").classList.add("on");$("#sheet").classList.add("on");
}

/* ---------- log ---------- */
function pLog(){
  if(A.log===null)loadLog();
  let h=`<div class="wrap">${head("Activity Log","Riwayat perubahan di aplikasi Mac",`${refBtn()}`)}${banner()}`;
  if(A.log===null)return h+`<div class="empty"><span class="spin"></span></div></div>`;
  if(!A.log.length)return h+`<div class="empty">Belum ada catatan.</div></div>`;
  const AC={tambah:["b-mu","Tambah"],ubah:["b-warn","Ubah"],hapus:["b-err","Hapus"],massal:["b-mu","Massal"]};let day="";
  A.log.slice(0,150).forEach(e=>{const d=(e.t||"").slice(0,10);if(d!==day){day=d;h+=`<h2>${fd(d)}</h2>`}
    const a=AC[e.a]||["b-mu",e.a||""],mn=MENUS[e.m]?MENUS[e.m].t:(e.m==="*"?"Beberapa menu":e.m);
    h+=`<div class="card" style="padding:11px 13px"><div class="row sp"><span class="badge ${a[0]}">${a[1]}</span><span class="s" style="margin:0">${esc(mn)} · ${esc((e.t||"").slice(11,16))}</span></div><div class="t" style="margin-top:6px;-webkit-line-clamp:2">${esc(e.title||"")}</div>${(e.ch||[]).length?`<div class="s">${e.ch.slice(0,3).map(c=>esc(c[0])+": "+esc(c[1]||"∅")+" → "+esc(c[2]||"∅")).join("<br>")}</div>`:""}</div>`});
  return h+`</div>`;
}

/* ---------- menu ---------- */
function pMenu(){
  let h=`<div class="wrap">${head("Menu","Semua menu · hanya baca",refBtn())}${banner()}<div class="tiles">`;
  ORDER.forEach(k=>{const m=MENUS[k],n=(S()[k]||[]).length;h+=`<button class="tile" onclick="go('list','${k}')"><div class="e" style="--tc:${TC[k]}">${m.e}</div><b>${esc(m.t)}</b><span>${n} item</span></button>`});
  h+=`<button class="tile" onclick="go('media')"><div class="e" style="--tc:${TC.media}">${mi(IC.media)}</div><b>Media Monitoring</b><span>Pemberitaan</span></button><button class="tile" onclick="go('log')"><div class="e" style="--tc:${TC.log}">${mi(IC.log)}</div><b>Activity Log</b><span>Riwayat perubahan</span></button></div>`;
  h+=`<h2>Info</h2><div class="card"><div class="s" style="margin:0">Data dari Mac per</div><div>${A.at?fdt(A.at):"–"}</div><div class="s">Versi HP hanya untuk memantau. Data tersimpan di HP sehingga tetap bisa dibuka saat offline atau Mac mati. Perubahan dikerjakan di Mac, lalu otomatis muncul di sini (ketuk ↻).</div></div><button class="card tap" style="color:var(--err);text-align:center;font-weight:600" onclick="if(confirm('Keluar dan hapus data dari HP ini? Untuk membuka lagi perlu internet dan link dari Mac.'))logout()">Keluar</button></div>`;
  return h;
}

/* ---------- render + navigasi ---------- */
function tabs(){
  const T=[["home","Beranda",ic.home],["dispo","Dispo",ic.inbox],["task","Task",ic.task],["media","Media",ic.chart],["menu","Menu",ic.grid]];
  const cur=A.route==="list"&&(A.menu==="dispo"||A.menu==="task")?A.menu:(A.route==="list"||A.route==="log")?"menu":A.route;
  return `<nav class="tabs">${T.map(([r,l,p])=>`<button class="${cur===r?"on":""}" onclick="${r==="dispo"||r==="task"?`go('list','${r}')`:`go('${r}')`}"><svg viewBox="0 0 24 24">${p}</svg>${l}</button>`).join("")}</nav>`;
}
function render(){
  const app=$("#app");
  if(A.boot){app.innerHTML=`<div class="wrap"><div class="empty"><span class="spin"></span></div></div>`;return}
  if(!A.data&&A.K&&!A.lerr){app.innerHTML=`<div class="wrap"><div class="empty"><span class="spin"></span><p>Memuat data…</p></div></div>`;return}
  if(!A.data){app.innerHTML=`<div class="wrap login"><img class="logo" src="icon-180.png" alt=""><h1>Workspace</h1><p class="sub">Buka link dari Mac sekali saja. Kalau layar ini muncul di aplikasi Home Screen, tempel link-nya di bawah.</p><input id="lk" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tempel link dari Mac" onkeydown="if(event.key==='Enter')pasteLink()"><div class="err">${esc(A.lerr)}</div><button class="go" onclick="pasteLink()">Buka</button></div>`;return}
  const y=window.scrollY;
  app.innerHTML=({home:pHome,list:pList,media:pMedia,log:pLog,menu:pMenu}[A.route]||pHome)()+tabs();
  if(window._keep)window.scrollTo(0,y);
}
function go(r,k){
  closeSheet();A.route=r;if(k){if(A.menu!==k){A.q="";A.flt="aktif"}A.menu=k}window._keep=0;
  render();window.scrollTo(0,0);
  
}
(function init(){
  window._keep=1;render();boot();
  if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  document.addEventListener("visibilitychange",()=>{if(document.hidden)return;TD=new Date().toLocaleDateString("sv");if(A.data)render();if(!A.at||Date.now()-new Date(A.at.replace(" ","T")).getTime()>60000)refresh(true)});
  window.addEventListener("online",()=>refresh(true));
})();
</script>
